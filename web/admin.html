<!doctype html>
<!-- Operator console. The ONLY page that shows the speaker's own words and every
     language of the session, because a mistranslation cannot be diagnosed without the
     source. Never link this to attendees. Minimal for P1; the level meter, latency
     percentiles and session controls land in P5. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>livesubs – Operator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="page admin">
    <header class="admin-head">
      <h1>livesubs</h1>
      <dl class="admin-stats">
        <div><dt>Status</dt><dd id="stat-status">–</dd></div>
        <div><dt>Zuschauer</dt><dd id="stat-viewers">–</dd></div>
        <div><dt>Verworfen</dt><dd id="stat-dropped">0</dd></div>
        <div><dt>Segment</dt><dd id="stat-seq">–</dd></div>
        <div><dt>Render</dt><dd id="stat-render">–</dd></div>
      </dl>
    </header>

    <section class="admin-live">
      <h2>Aktuell</h2>
      <div id="live-lines"></div>
      <p id="live-src" class="admin-src">–</p>
    </section>

    <section class="admin-log">
      <h2>Verlauf</h2>
      <ol id="history" class="admin-history"></ol>
    </section>

    <script type="module" src="/static/admin.js"></script>
  </body>
</html>
