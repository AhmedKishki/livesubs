<!doctype html>
<!-- Operator console, always in English whatever the session's languages are. The
     ONLY page that shows the speaker's own words and every language of the session,
     because a mistranslation cannot be diagnosed without the source. Never link this
     to attendees. The figures come from /api/stats, which carries counts and timings
     and never the text of a lecture. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>livesubs – Operator</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="page admin">
    <header class="admin-head">
      <div>
        <h1>livesubs</h1>
        <p id="mode" class="admin-mode">–</p>
      </div>
      <p id="overall" class="admin-overall" data-status="live">–</p>
    </header>

    <section id="alerts" class="admin-alerts" aria-live="polite"></section>

    <section class="cards">
      <article class="card">
        <h2>Audience</h2>
        <dl id="audience" class="kv"></dl>
      </article>

      <article class="card">
        <h2>Audio input</h2>
        <div class="meter" aria-hidden="true">
          <div id="meter-level" class="meter-level"></div>
          <div id="meter-peak" class="meter-peak"></div>
          <div id="meter-floor" class="meter-floor"></div>
        </div>
        <dl id="audio" class="kv"></dl>
      </article>

      <article class="card">
        <h2>Recognition</h2>
        <dl id="recognition" class="kv"></dl>
      </article>

      <article class="card">
        <h2>Server</h2>
        <dl id="server" class="kv"></dl>
      </article>

      <article class="card card-wide">
        <h2>Translation</h2>
        <table id="languages" class="grid">
          <thead>
            <tr>
              <th>Language</th>
              <th>Readers</th>
              <th>State</th>
              <th>Queue</th>
              <th>Done</th>
              <th>Failed</th>
              <th title="From the end of the spoken words to the final line going out. Median / 95th percentile.">Delay</th>
              <th title="From the request to the first translated words. Median / 95th percentile.">First words</th>
              <th title="Whole translation request. Median / 95th percentile.">Request</th>
              <th title="Reported by phones: from a line arriving to being on screen. Median / 95th percentile.">On phone</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </article>
    </section>

    <section class="admin-live">
      <h2>Now</h2>
      <div id="live-lines"></div>
      <p id="live-src" class="admin-src">–</p>
    </section>

    <section class="admin-log">
      <h2>Errors</h2>
      <ul id="errors" class="admin-errors"><li class="admin-src">None.</li></ul>
    </section>

    <section class="admin-log">
      <h2>History</h2>
      <ol id="history" class="admin-history"></ol>
    </section>

    <script type="module" src="/static/admin.js"></script>
  </body>
</html>
