<!doctype html>
<!-- Landing page: one screen, one job. The QR code, the URL in plain text for
     anyone who cannot scan, and a short reassurance about privacy. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Untertitel – Beitreten</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="page">
    <main class="join">
      <h1 id="session-name">Untertitel</h1>

      <img id="qr" class="join-qr" alt="QR-Code zum Scannen" />
      <p id="qr-error" class="join-note" hidden>
        QR-Code konnte nicht geladen werden. Bitte die Adresse unten verwenden.
      </p>

      <p class="join-url"><a id="join-url" href="#">…</a></p>

      <ul class="join-notes">
        <li>Deutsche Untertitel, live</li>
        <li>Keine App, kein Login</li>
        <li>Auf Ihrem Gerät wird nichts gespeichert oder übertragen</li>
      </ul>
    </main>
    <script type="module" src="/static/landing.js"></script>
  </body>
</html>
